name: Conformance

# The cross-language conformance suite is the only thing that catches the two
# reference implementations drifting apart on the wire format. It ran on
# neither push nor PR until 2026-08, and skipped silently without
# biscuit-python, which is how the implementations diverged unnoticed.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Upgrade pip
        # The runner's bundled pip calls prepare_metadata_for_build_editable
        # unconditionally, which the resolved hatchling does not expose.
        run: python -m pip install --upgrade pip

      - name: Install Python package
        working-directory: python
        run: pip install -e .[dev]

      - name: Fail if biscuit-python is missing
        # The conformance tests skip without it. A silent skip reads as a pass.
        run: python -c "import biscuit_auth"

      - name: Build Rust interop binaries
        working-directory: rust
        run: cargo build --bin create_chained_token --bin verify_chained_token

      - name: Cross-language conformance
        run: python -m pytest tests/conformance/ -v

      - name: Python unit tests
        working-directory: python
        run: python -m pytest tests/ -v --ignore=tests/test_aip_agents/

      - name: Rust tests
        working-directory: rust
        run: cargo test
